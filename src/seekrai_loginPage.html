<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekr - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="/seekrai_ui.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="/src/images/Logo-Red_Hat-Hat_icon-Standard-RGB.svg" class="logo-icon" alt="Red Hat" />
            <div class="logo-text">Seekr</div>
            <div class="logo-subtitle">Red Hat Internal Search Tool</div>
        </div>

        <!-- Login Header -->
        <div class="login-header">
            <h1 class="login-title">Sign In</h1>
            <p class="login-description">Use your Kerberos credentials to access Seekr</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="/seekr/login">
            <div class="form-group">
                <label for="username" class="form-label">Kerberos Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your Kerberos username"
                    required
                    autocomplete="username"
                />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your Kerberos password"
                        required
                        autocomplete="current-password"
                    />
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <svg class="eye-icon" id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-icon" id="eyeClosed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">Sign In</button>
        </form>

        <!-- Help Text -->
        <div class="help-text">
            Having trouble with your Kerberos credentials?
            <a href="https://redhathub.service-now.com/hub?id=sc_cat_item&sys_id=3f1dd0320a0a0b99000a53f7604a2ef9"
               class="help-link"
               target="_blank">Contact IT Support</a>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="/seekrai_ui.js"></script>
</body>
</html>
